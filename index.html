<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo Ứng Đời Nhau</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oregano:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Cinzel:wght@400;600&family=Alex+Brush&family=Playfair+Display:ital,wght@0,500;1,500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ✦ 1. KHU VỰC TỰ ĐỔI FONT CHỮ CHO TỪNG DÒNG ✦
       ========================================================================== */
    :root {
      /* Dòng 1: Tiêu đề nhỏ trên cùng */
      --font-top-tag:   'Cinzel', 'Oregano', serif;

      /* Dòng 2: Dòng câu nói “What is grief, if not love persevering?” */
      --font-quote:     'Cormorant Garamond', 'Oregano', Georgia, serif;

      /* Dòng 3: Dòng chữ lớn (B Á O   Ứ N G   Đ Ờ I   N H A U) */
      --font-brand:     'Cinzel', 'Oregano', serif;

      /* Dòng 4: Chữ trên nút "Xem báo ứng" */
      --font-button:    'Cormorant Garamond', 'Oregano', Georgia, serif;

      /* Dòng 5: Dòng chữ nhỏ nhấp nháy "C H Ạ M   Đ Ể   M Ở" */
      --font-hint:      'Cinzel', 'Oregano', serif;

      /* Bảng màu chủ đạo */
      --crystal-cyan: #00f0ff;
      --crystal-blue: #0066ff;
      --antique-cream: #f6f1e8;
      --glass-border: rgba(200, 240, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030b14;
      color: var(--antique-cream);
    }

    /* ẢNH NỀN SÓNG NƯỚC */
    .water-bg-layer {
      position: fixed;
      inset: -15px;
      background-color: #04101e;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: saturate(1.2) contrast(1.1);
      z-index: 1;
      animation: waterUndulate 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes waterUndulate {
      0% { transform: scale(1.02); }
      100% { transform: scale(1.06) translateY(-8px); }
    }

    /* CANVAS HIỆU ỨNG: SÓNG NƯỚC & HOA HỒNG 3D ĐA GÓC NHÌN */
    #fxCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: auto;
    }

    /* LỚP PHỦ VIGNETTE NGHỆ THUẬT */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      background: radial-gradient(circle at center, transparent 38%, rgba(2, 6, 12, 0.82) 100%);
    }

    /* KHUNG GIAO DIỆN CHÍNH */
    .main-wrapper {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 34px 45px;
      pointer-events: none;
    }

    /* THANH TRÊN CÙNG */
    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .site-tag {
      font-family: var(--font-top-tag);
      font-size: 0.72rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(220, 245, 255, 0.9);
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.55);
    }

    /* ĐĨA NHẠC MÀU LAM */
    .vinyl-player-box {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      background: rgba(6, 20, 32, 0.55);
      padding: 6px 14px 6px 8px;
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.35s ease;
    }

    .vinyl-player-box:hover {
      border-color: var(--crystal-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
      transform: translateY(-2px);
    }

    .vinyl-disc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      position: relative;
      background: repeating-radial-gradient(
        circle,
        #0b2942 0px,
        #0b2942 2px,
        #031422 3px,
        #123e61 4px
      );
      box-shadow: 0 0 12px rgba(0, 195, 255, 0.4), inset 0 0 4px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-center-label {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #a2edff 0%, #0077b6 70%, #023e8a 100%);
      box-shadow: 0 0 5px rgba(0, 240, 255, 0.8);
      position: relative;
    }

    .vinyl-center-label::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #030b14;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .vinyl-disc.spinning {
      animation: spinVinyl 3.5s linear infinite;
    }

    @keyframes spinVinyl {
      100% { transform: rotate(360deg); }
    }

    .vinyl-text {
      font-family: var(--font-top-tag);
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(220, 245, 255, 0.85);
    }

    /* KHU VỰC TRUNG TÂM */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
      pointer-events: auto;
      max-width: 680px;
    }

    /* BỨC ẢNH LƠ LỬNG Ở GIỮA */
    .floating-card-wrapper {
      position: relative;
      cursor: pointer;
      animation: floatSmooth 6s ease-in-out infinite;
      perspective: 1000px;
    }

    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(0.6deg); }
    }

    .floating-picture-frame {
      width: 250px;
      height: 330px;
      padding: 10px;
      background: linear-gradient(145deg, rgba(230, 250, 255, 0.3) 0%, rgba(15, 45, 70, 0.6) 50%, rgba(4, 18, 30, 0.85) 100%);
      border: 1.5px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(14px);
      box-shadow: 
        inset 0 0 25px rgba(255, 255, 255, 0.25),
        0 20px 50px rgba(0, 0, 0, 0.65),
        0 0 45px rgba(0, 210, 255, 0.35);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .floating-card-wrapper:hover .floating-picture-frame {
      transform: scale(1.035) translateY(-3px);
      border-color: #ffffff;
      box-shadow: 
        inset 0 0 35px rgba(255, 255, 255, 0.4),
        0 25px 65px rgba(0, 0, 0, 0.8),
        0 0 60px rgba(0, 240, 255, 0.6);
    }

    .floating-picture-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
    }

    /* DÒNG CÂU NÓI QUOTE */
    .quote-text {
      font-family: var(--font-quote);
      font-style: italic;
      font-size: clamp(1.6rem, 3.4vw, 2.3rem);
      font-weight: 400;
      color: #ffffff;
      line-height: 1.35;
      margin-top: 24px;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.7), 0 2px 4px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
    }

    /* DÒNG TIÊU ĐỀ LỚN */
    .brand-title {
      font-family: var(--font-brand);
      font-size: 0.76rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(190, 240, 255, 0.9);
      margin-top: 12px;
      margin-bottom: 26px;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    /* NÚT BẤM "XEM BÁO ỨNG" */
    .btn-action-enter {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 13px 40px;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.24) 0%, rgba(18, 48, 80, 0.75) 50%, rgba(140, 45, 220, 0.28) 100%);
      border: 1.5px solid rgba(190, 240, 255, 0.45);
      border-radius: 40px;
      color: #ffffff;
      font-family: var(--font-button);
      font-size: 1.25rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      box-shadow: 
        inset 0 0 25px rgba(255, 255, 255, 0.25),
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(0, 240, 255, 0.35);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-action-enter:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #ffffff;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.42) 0%, rgba(28, 75, 120, 0.9) 50%, rgba(160, 50, 240, 0.42) 100%);
      box-shadow: 
        inset 0 0 30px rgba(255, 255, 255, 0.45),
        0 15px 45px rgba(0, 0, 0, 0.7),
        0 0 45px rgba(0, 240, 255, 0.75);
    }

    .btn-action-enter .sparkle-icon {
      font-size: 1.1rem;
      color: var(--crystal-cyan);
      text-shadow: 0 0 10px var(--crystal-cyan);
    }

    .btn-action-enter .arrow-svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      transition: transform 0.3s ease;
    }

    .btn-action-enter:hover .arrow-svg {
      transform: translateX(5px);
    }

    /* DÒNG HINT CHẠM ĐỂ MỞ */
    .tap-hint {
      font-family: var(--font-hint);
      font-size: 0.65rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(200, 240, 255, 0.65);
      margin-top: 14px;
      animation: pulseHint 2.5s infinite ease-in-out;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.95; }
    }

    @media (max-width: 600px) {
      .floating-picture-frame {
        width: 200px;
        height: 270px;
      }
      .quote-text {
        font-size: 1.4rem;
      }
      .btn-action-enter {
        padding: 12px 30px;
        font-size: 1.12rem;
      }
    }
  </style>
</head>
<body>

  <!-- Lớp ảnh nền sóng nước -->
  <div class="water-bg-layer" id="waterBg"></div>

  <!-- Canvas sóng nước tương tác & Hoa hồng 3D đa góc nhìn rơi -->
  <canvas id="fxCanvas"></canvas>

  <!-- Lớp phủ viền tối nghệ thuật -->
  <div class="vignette-overlay"></div>

  <!-- Giao diện chính -->
  <div class="main-wrapper">

    <!-- Thanh trên cùng -->
    <header class="top-bar">
      <div class="site-tag">✦ BÁO ỨNG ĐỜI NHAU • ARCHIVE 2026</div>

      <!-- ĐĨA NHẠC MÀU LAM -->
      <div class="vinyl-player-box" id="vinylPlayer" title="Nhấp để bật / tắt nhạc">
        <div class="vinyl-disc" id="vinylDisc">
          <div class="vinyl-center-label"></div>
        </div>
        <span class="vinyl-text" id="vinylText">Âm Nhạc</span>
      </div>
    </header>

    <!-- Khu vực trung tâm: Bức ảnh lơ lửng + Dòng chữ + Nút Xem báo ứng -->
    <div class="center-stage">
      
      <!-- BỨC ẢNH LƠ LỬNG Ở GIỮA -->
      <div class="floating-card-wrapper" id="cardWrapper">
        <div class="floating-picture-frame">
          <img src="" id="centerImg" alt="Bức ảnh lơ lửng">
        </div>
      </div>

      <!-- Dòng quote -->
      <h1 class="quote-text">“What is grief, if not love persevering?”</h1>

      <!-- Dòng brand title -->
      <div class="brand-title">B Á O   Ứ N G   Đ Ờ I   N H A U</div>

      <!-- Khối chữ nhật "Xem báo ứng" -->
      <button class="btn-action-enter" id="btnEnter">
        <span class="sparkle-icon">❖</span>
        <span>Xem báo ứng</span>
        <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <div class="tap-hint">C H Ạ M   Đ Ể   M Ở</div>
    </div>

    <div></div>

  </div>

  <script>
    /* ==========================================================================
       ✦ 2. KHU VỰC DÁN LINK ẢNH CỦA BẠN ✦
       ========================================================================== */
    const MY_CONFIG = {
      // 1. Link ảnh nền:
      backgroundImageUrl: 'https://www.pixelstalk.net/wp-content/uploads/2025/05/Swirling-schools-of-fish-shimmering-in-deep-blue-sea.webp',

      // 2. Link ảnh lơ lửng ở giữa:
      centerPictureUrl: 'https://i.pinimg.com/736x/90/e6/aa/90e6aa0bc289c51d64f54771058b65b6.jpg',

      // 3. Link file nhạc mp3:
      musicMp3Url: 'https://open.spotify.com/playlist/5jZ5if9qoRWvhSYWm4SOr0?si=e4pxqy-CTc6luLS135FYYw'
    };

    // Gán ảnh
    const waterBg = document.getElementById('waterBg');
    const centerImg = document.getElementById('centerImg');

    waterBg.style.backgroundImage = `radial-gradient(circle at 50% 50%, rgba(0, 140, 200, 0.22) 0%, rgba(2, 8, 16, 0.88) 100%), url('${MY_CONFIG.backgroundImageUrl}')`;
    centerImg.src = MY_CONFIG.centerPictureUrl;

    // Tương tác nghiêng 3D của bức ảnh khi rê chuột
    const cardWrapper = document.getElementById('cardWrapper');
    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      cardWrapper.style.transform = `perspective(1000px) rotateY(${x * 9}deg) rotateX(${-y * 9}deg)`;
    });

    /* ==========================================================================
       ✦ 3. ĐĨA NHẠC MÀU LAM & ÂM THANH SÓNG BIỂN
       ========================================================================== */
    const vinylPlayer = document.getElementById('vinylPlayer');
    const vinylDisc = document.getElementById('vinylDisc');
    const vinylText = document.getElementById('vinylText');

    let audioCtx = null, oceanGain = null, isPlaying = false;
    let customAudio = null;

    if (MY_CONFIG.musicMp3Url.trim() !== '') {
      customAudio = new Audio(MY_CONFIG.musicMp3Url);
      customAudio.loop = true;
    }

    function toggleMusic() {
      isPlaying = !isPlaying;

      if (isPlaying) {
        vinylDisc.classList.add('spinning');
        vinylText.textContent = "Đang Phát";
        vinylText.style.color = "var(--crystal-cyan)";

        if (customAudio) {
          customAudio.play().catch(() => {
            initOceanSound();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            oceanGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 1.5);
          });
        } else {
          initOceanSound();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          oceanGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 1.5);
        }
      } else {
        vinylDisc.classList.remove('spinning');
        vinylText.textContent = "Tạm Dừng";
        vinylText.style.color = "rgba(220, 245, 255, 0.85)";

        if (customAudio) {
          customAudio.pause();
        } else if (oceanGain) {
          oceanGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
        }
      }
    }

    function initOceanSound() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      oceanGain = audioCtx.createGain();
      oceanGain.gain.setValueAtTime(0, audioCtx.currentTime);
      oceanGain.connect(audioCtx.destination);

      const bufferSize = audioCtx.sampleRate * 3;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.08;

      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(260, audioCtx.currentTime);

      const lfo = audioCtx.createOscillator();
      lfo.frequency.setValueAtTime(0.12, audioCtx.currentTime);
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.setValueAtTime(300, audioCtx.currentTime);
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      noise.connect(filter);
      filter.connect(oceanGain);
      noise.start();
      lfo.start();
    }

    vinylPlayer.addEventListener('click', toggleMusic);

    /* ==========================================================================
       ✦ 4. SÓNG NƯỚC KHI CHẠM ✦
       ========================================================================== */
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');

    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const ripples = [];
    function makeRipple(x, y) {
      ripples.push({ x, y, r: 4, maxR: Math.min(w, h) * 0.35 + 40, alpha: 0.9, speed: 2.8 });
      setTimeout(() => {
        ripples.push({ x, y, r: 2, maxR: Math.min(w, h) * 0.25, alpha: 0.6, speed: 2.2 });
      }, 150);
    }

    window.addEventListener('pointerdown', (e) => makeRipple(e.clientX, e.clientY));

    /* ==========================================================================
       ✦ 5. HỆ THỐNG ĐA GÓC NHÌN 3D (MULTI-ANGLE VOLUMETRIC SYSTEM) ✦
       (Dựng 4 góc chụp thật của đóa hoa: Chính diện, Nghiêng 45° thấy lòng, 
        Ngang 90° thấy chiều cao, và Mặt đáy thấy đài hoa)
       ========================================================================== */
    const SPRITE_SIZE = 260;
    const center = SPRITE_SIZE / 2;

    // --- GÓC 1: MẶT CHÍNH DIỆN (0° - Top-Down Bloom) ---
    const spriteFront = document.createElement('canvas');
    spriteFront.width = spriteFront.height = SPRITE_SIZE;
    const s1 = spriteFront.getContext('2d');
    (function drawFront() {
      // 7 cánh xòe ngoài cùng
      for (let i = 0; i < 7; i++) {
        s1.save();
        s1.translate(center, center);
        s1.rotate((i * Math.PI * 2) / 7);
        s1.beginPath();
        s1.moveTo(0, -35);
        s1.bezierCurveTo(-55, -45, -60, -95, 0, -100);
        s1.bezierCurveTo(60, -95, 55, -45, 0, -35);
        const g = s1.createRadialGradient(0, -65, 5, 0, -65, 55);
        g.addColorStop(0, '#3895db');
        g.addColorStop(0.65, '#7ec9fd');
        g.addColorStop(1, '#e4f7ff');
        s1.fillStyle = g;
        s1.shadowColor = 'rgba(10, 45, 80, 0.3)';
        s1.shadowBlur = 8;
        s1.fill();
        s1.strokeStyle = 'rgba(235, 250, 255, 0.75)';
        s1.lineWidth = 0.8;
        s1.stroke();
        s1.restore();
      }
      // Cánh giữa
      for (let i = 0; i < 6; i++) {
        s1.save();
        s1.translate(center, center);
        s1.rotate((i * Math.PI * 2) / 6 + 0.5);
        s1.beginPath();
        s1.moveTo(0, -20);
        s1.bezierCurveTo(-40, -30, -42, -72, 0, -75);
        s1.bezierCurveTo(42, -72, 40, -30, 0, -20);
        const g = s1.createRadialGradient(0, -45, 4, 0, -45, 40);
        g.addColorStop(0, '#217ec8');
        g.addColorStop(0.6, '#58b8f8');
        g.addColorStop(1, '#c5edff');
        s1.fillStyle = g;
        s1.fill();
        s1.restore();
      }
      // Nụ xoáy tâm hoa
      for (let step = 0; step < 7; step++) {
        s1.save();
        s1.translate(center, center);
        s1.rotate(step * 0.88);
        const r = 24 - step * 3.2;
        s1.beginPath();
        s1.arc(0, 0, Math.max(2, r), 0.1, Math.PI * 1.6);
        s1.strokeStyle = `rgba(235, 252, 255, ${0.95 - step * 0.08})`;
        s1.lineWidth = 2 - step * 0.16;
        s1.stroke();
        s1.fillStyle = step % 2 === 0 ? '#3296e6' : '#64c0fb';
        s1.fill();
        s1.restore();
      }
    })();

    // --- GÓC 2: GÓC NGHIÊNG 45° THẤY RÕ LÒNG SÂU VÀ ĐỘ CONG 3D (Perspective Chalice) ---
    const spritePerspective = document.createElement('canvas');
    spritePerspective.width = spritePerspective.height = SPRITE_SIZE;
    const s2 = spritePerspective.getContext('2d');
    (function drawPerspective() {
      s2.save();
      s2.translate(center, center + 10);

      // Cánh phía sau vươn cao
      for (let i = -2; i <= 2; i++) {
        s2.save();
        s2.rotate(i * 0.35);
        s2.beginPath();
        s2.moveTo(0, 0);
        s2.bezierCurveTo(-45, -40, -50, -105, 0, -110);
        s2.bezierCurveTo(50, -105, 45, -40, 0, 0);
        const g = s2.createLinearGradient(0, 0, 0, -110);
        g.addColorStop(0, '#1a649e');
        g.addColorStop(0.7, '#62befa');
        g.addColorStop(1, '#d8f4ff');
        s2.fillStyle = g;
        s2.fill();
        s2.restore();
      }

      // Hốc bóng tối ở lòng hoa tạo chiều sâu hun hút
      s2.beginPath();
      s2.ellipse(0, -15, 36, 20, 0, 0, Math.PI * 2);
      const cavityGrad = s2.createRadialGradient(0, -15, 2, 0, -15, 36);
      cavityGrad.addColorStop(0, '#0b3558');
      cavityGrad.addColorStop(0.8, '#1e75b8');
      cavityGrad.addColorStop(1, 'transparent');
      s2.fillStyle = cavityGrad;
      s2.fill();

      // Nụ xoáy nghiêng
      s2.save();
      s2.translate(0, -22);
      s2.scale(1, 0.65);
      for (let step = 0; step < 5; step++) {
        s2.rotate(0.9);
        s2.beginPath();
        s2.arc(0, 0, 18 - step * 3, 0.2, Math.PI * 1.7);
        s2.strokeStyle = '#daf3ff';
        s2.lineWidth = 1.6;
        s2.stroke();
      }
      s2.restore();

      // Cánh hoa phía trước úp vồng xuống tạo khối lòng chảo
      for (let i = -1; i <= 1; i++) {
        s2.save();
        s2.rotate(i * 0.45);
        s2.beginPath();
        s2.moveTo(0, 0);
        s2.bezierCurveTo(-55, 10, -50, 48, 0, 52);
        s2.bezierCurveTo(50, 48, 55, 10, 0, 0);
        const g = s2.createLinearGradient(0, 0, 0, 52);
        g.addColorStop(0, '#2c8bd6');
        g.addColorStop(0.65, '#82d0fe');
        g.addColorStop(1, '#effaff');
        s2.fillStyle = g;
        s2.shadowColor = 'rgba(5, 30, 60, 0.35)';
        s2.shadowBlur = 8;
        s2.fill();
        s2.strokeStyle = 'rgba(235, 252, 255, 0.85)';
        s2.lineWidth = 0.9;
        s2.stroke();
        s2.restore();
      }
      s2.restore();
    })();

    // --- GÓC 3: GÓC NHÌN NGANG 90° (Full Side Profile - Thấy Toàn Bộ Chiều Cao Đóa Hoa) ---
    const spriteSide = document.createElement('canvas');
    spriteSide.width = spriteSide.height = SPRITE_SIZE;
    const s3 = spriteSide.getContext('2d');
    (function drawSide() {
      s3.save();
      s3.translate(center, center + 15);

      // Cánh vươn cao trung tâm
      s3.beginPath();
      s3.moveTo(-25, 0);
      s3.bezierCurveTo(-35, -50, -20, -105, 0, -112);
      s3.bezierCurveTo(20, -105, 35, -50, 25, 0);
      s3.closePath();
      const gCenter = s3.createLinearGradient(0, 0, 0, -112);
      gCenter.addColorStop(0, '#1c6ca8');
      gCenter.addColorStop(0.7, '#64befa');
      gCenter.addColorStop(1, '#e3f7ff');
      s3.fillStyle = gCenter;
      s3.fill();

      // Cánh xòe sang trái uốn cong
      s3.beginPath();
      s3.moveTo(-5, 0);
      s3.bezierCurveTo(-45, -20, -85, -60, -80, -95);
      s3.bezierCurveTo(-55, -80, -30, -35, -5, 0);
      const gLeft = s3.createLinearGradient(-5, 0, -80, -95);
      gLeft.addColorStop(0, '#2582cb');
      gLeft.addColorStop(0.7, '#80cffe');
      gLeft.addColorStop(1, '#f0fbff');
      s3.fillStyle = gLeft;
      s3.shadowColor = 'rgba(0,0,0,0.25)';
      s3.shadowBlur = 6;
      s3.fill();

      // Cánh xòe sang phải uốn cong
      s3.beginPath();
      s3.moveTo(5, 0);
      s3.bezierCurveTo(45, -20, 85, -60, 80, -95);
      s3.bezierCurveTo(55, -80, 30, -35, 5, 0);
      const gRight = s3.createLinearGradient(5, 0, 80, -95);
      gRight.addColorStop(0, '#2582cb');
      gRight.addColorStop(0.7, '#80cffe');
      gRight.addColorStop(1, '#f0fbff');
      s3.fillStyle = gRight;
      s3.fill();

      // Đài hoa và cuống hoa màu xanh ngọc dưới đáy
      s3.beginPath();
      s3.moveTo(-35, -5);
      s3.bezierCurveTo(-25, 25, 0, 35, 0, 35);
      s3.bezierCurveTo(0, 35, 25, 25, 35, -5);
      s3.closePath();
      const sepalGrad = s3.createLinearGradient(0, -5, 0, 35);
      sepalGrad.addColorStop(0, '#0d4b55');
      sepalGrad.addColorStop(0.7, '#1b7d8c');
      sepalGrad.addColorStop(1, '#4de3c4');
      s3.fillStyle = sepalGrad;
      s3.fill();

      // Cuống hoa
      s3.beginPath();
      s3.arc(0, 36, 7, 0, Math.PI * 2);
      s3.fillStyle = '#14606c';
      s3.fill();

      s3.restore();
    })();

    // --- GÓC 4: MẶT ĐÁY (180° - Calyx & Sepals Thấy Rõ Cuống Khi Lộn Ngược) ---
    const spriteBottom = document.createElement('canvas');
    spriteBottom.width = spriteBottom.height = SPRITE_SIZE;
    const s4 = spriteBottom.getContext('2d');
    (function drawBottom() {
      s4.save();
      s4.translate(center, center);

      // Lưng cánh hoa xanh thẫm
      s4.beginPath();
      s4.arc(0, 0, 92, 0, Math.PI * 2);
      const g = s4.createRadialGradient(0, 0, 10, 0, 0, 92);
      g.addColorStop(0, '#155282');
      g.addColorStop(0.7, '#2b84c8');
      g.addColorStop(1, '#72c5fa');
      s4.fillStyle = g;
      s4.fill();

      // 5 lá đài hoa xanh ngọc chĩa nhọn
      for (let i = 0; i < 5; i++) {
        s4.save();
        s4.rotate((i * Math.PI * 2) / 5);
        s4.beginPath();
        s4.moveTo(0, 0);
        s4.bezierCurveTo(-18, -25, -20, -85, 0, -112);
        s4.bezierCurveTo(20, -85, 18, -25, 0, 0);
        const sepG = s4.createLinearGradient(0, 0, 0, -112);
        sepG.addColorStop(0, '#0a3d46');
        sepG.addColorStop(0.7, '#187887');
        sepG.addColorStop(1, '#5eead4');
        s4.fillStyle = sepG;
        s4.shadowColor = 'rgba(0,0,0,0.35)';
        s4.shadowBlur = 6;
        s4.fill();
        s4.restore();
      }

      // Cuống tròn trung tâm
      s4.beginPath();
      s4.arc(0, 0, 18, 0, Math.PI * 2);
      s4.fillStyle = '#0d5561';
      s4.fill();
      s4.strokeStyle = '#2dd4bf';
      s4.lineWidth = 1.6;
      s4.stroke();

      s4.restore();
    })();

    /* ==========================================================================
       ✦ 6. ĐỘNG LỰC HỌC XOAY 3D VÀ RENDER THẬT ✦
       ========================================================================== */
    const flowers = [];
    const NUM_FLOWERS = 20;

    class Volumetric3DFlower {
      constructor(initRandomY = false) {
        this.reset(initRandomY);
      }
      reset(initRandomY = false) {
        this.x = Math.random() * w;
        this.y = initRandomY ? Math.random() * h : -70;
        this.size = 32 + Math.random() * 26; // Kích thước đóa hoa lớn nổi khối

        this.speedY = 0.55 + Math.random() * 0.7;
        this.driftSpeed = 0.45 + Math.random() * 0.55;

        // Góc xoay 3 chiều không gian thật
        this.pitch = Math.random() * Math.PI * 2; // Xoay lộn nhào (trục X)
        this.yaw = Math.random() * Math.PI * 2;   // Xoay nghiêng (trục Y)
        this.roll = Math.random() * Math.PI * 2;  // Xoay tròn (trục Z)

        this.vPitch = (Math.random() - 0.5) * 0.022;
        this.vYaw = (Math.random() - 0.5) * 0.018;
        this.vRoll = (Math.random() - 0.5) * 0.016;

        this.sway = Math.random() * Math.PI * 2;
        this.swaySpeed = 0.016 + Math.random() * 0.018;

        this.opacity = 0.88 + Math.random() * 0.12;
      }
      update() {
        this.y += this.speedY;
        this.sway += this.swaySpeed;
        this.x += Math.sin(this.sway) * this.driftSpeed;

        this.pitch += this.vPitch;
        this.yaw += this.vYaw;
        this.roll += this.vRoll;

        // Chạm đáy mặt nước tạo gợn sóng
        if (this.y > h + 55) {
          if (Math.random() > 0.4) makeRipple(this.x, h - 25);
          this.reset(false);
        }
      }
      draw(c) {
        c.save();
        c.translate(this.x, this.y);

        // Vector hướng góc nhìn 3D (cosTilt)
        // cosTilt = 1: Đang nhìn thẳng chính diện
        // cosTilt = 0: Đang nhìn ngang hông (Profile)
        // cosTilt = -1: Đang nhìn mặt đáy (Cuống hoa)
        const cosPitch = Math.cos(this.pitch);
        const cosYaw = Math.cos(this.yaw);
        const cosTilt = cosPitch * cosYaw;
        const absTilt = Math.abs(cosTilt);

        // Độ co giãn phối cảnh tự nhiên
        const scaleX = cosYaw >= 0 ? 1 : -1;
        const scaleY = cosPitch >= 0 ? 1 : -1;

        // 1. Bóng đổ 3D mềm mại dưới làn nước
        c.save();
        c.translate(10, 16);
        c.rotate(this.roll);
        c.scale(0.85, 0.45 * Math.max(0.3, absTilt));
        c.globalAlpha = 0.15 * this.opacity;
        c.beginPath();
        c.arc(0, 0, this.size * 0.85, 0, Math.PI * 2);
        c.fillStyle = '#011222';
        c.fill();
        c.restore();

        // 2. Chuyển đổi và Render góc nhìn 3D thật (Volumetric Rendering)
        c.rotate(this.roll);
        c.scale(scaleX, scaleY);
        c.globalAlpha = this.opacity;

        const rad = this.size;

        if (cosTilt >= 0) {
          // --- MẶT TRÊN CỦA HOA ---
          if (absTilt > 0.65) {
            // Góc 1: Nhìn chính diện (0° - 40°)
            c.drawImage(spriteFront, -rad, -rad, rad * 2, rad * 2);
          } else if (absTilt > 0.25) {
            // Góc 2: Nhìn nghiêng 45° THẤY LÒNG HOA SÂU VÀ KHỐI NỔI
            c.drawImage(spritePerspective, -rad, -rad, rad * 2, rad * 2);
          } else {
            // Góc 3: Nhìn ngang 90° THẤY TOÀN BỘ CHIỀU CAO KHỐI HOA
            c.drawImage(spriteSide, -rad, -rad, rad * 2, rad * 2);
          }
        } else {
          // --- MẶT DƯỚI CỦA HOA ---
          if (absTilt > 0.4) {
            // Góc 4: Nhìn mặt đáy (thấy rõ đài hoa và cuống)
            c.drawImage(spriteBottom, -rad, -rad, rad * 2, rad * 2);
          } else {
            // Góc 3: Nhìn ngang cạnh bên
            c.drawImage(spriteSide, -rad, -rad, rad * 2, rad * 2);
          }
        }

        c.restore();
      }
    }

    for (let i = 0; i < NUM_FLOWERS; i++) {
      flowers.push(new Volumetric3DFlower(true));
    }

    function animateLoop() {
      ctx.clearRect(0, 0, w, h);

      // Vẽ sóng nước lan tỏa
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rip = ripples[i];
        rip.r += rip.speed;
        rip.alpha -= 0.01;

        if (rip.alpha <= 0 || rip.r >= rip.maxR) {
          ripples.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(rip.x, rip.y, rip.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(130, 235, 255, ${rip.alpha * 0.85})`;
        ctx.lineWidth = 2.2;
        ctx.shadowColor = 'rgba(0, 240, 255, 0.65)';
        ctx.shadowBlur = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(rip.x, rip.y, Math.max(0, rip.r - 8), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(180, 80, 255, ${rip.alpha * 0.4})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();
      }

      // Cập nhật và vẽ các đóa hoa hồng 3D đa góc nhìn
      flowers.forEach(f => {
        f.update();
        f.draw(ctx);
      });

      requestAnimationFrame(animateLoop);
    }
    animateLoop();

    // Nút Xem báo ứng
    const btnEnter = document.getElementById('btnEnter');
    btnEnter.addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = btnEnter.getBoundingClientRect();
      makeRipple(rect.left + rect.width / 2, rect.top + rect.height / 2);
      alert("✦ ĐÃ KÍCH HOẠT: XEM BÁO ỨNG ✦\n(Hệ thống hoa 3D đa góc nhìn đã hoạt động hoàn hảo!)");
    });
  </script>
