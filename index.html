<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo Ứng Đời Nhau</title>

  <!-- Google Fonts: Các font chữ mẫu (Bạn có thể nạp thêm font bạn thích ở đây) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oregano:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Cinzel:wght@400;600&family=Alex+Brush&family=Playfair+Display:ital,wght@0,500;1,500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ✦ 1. KHU VỰC TỰ ĐỔI FONT CHỮ CHO TỪNG DÒNG ✦
       ========================================================================== */
    :root {
      /* Dòng 1: Tiêu đề nhỏ trên cùng (✦ BÁO ỨNG • ARCHIVE) */
      --font-top-tag:   'Cinzel', 'Oregano', serif;

      /* Dòng 2: Dòng câu nói “What is grief, if not love persevering?” */
      --font-quote:     'Cormorant Garamond', Georgia, 'Oregano', serif;

      /* Dòng 3: Dòng chữ lớn (B Á O   Ứ N G   Đ Ờ I   N H A U) */
      --font-brand:     'Cinzel', 'Oregano', serif;

      /* Dòng 4: Chữ trên nút "Xem báo ứng" */
      --font-button:    'Cormorant Garamond', Georgia, 'Oregano', serif;

      /* Dòng 5: Dòng chữ nhỏ nhấp nháy "C H Ạ M   Đ Ể   M Ở" */
      --font-hint:      'Cinzel', 'Oregano', serif;

      /* Bảng màu chủ đạo */
      --crystal-cyan: #00f0ff;
      --crystal-blue: #0066ff;
      --antique-cream: #f6f1e8;
      --glass-border: rgba(200, 240, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030b14;
      color: var(--antique-cream);
    }

    /* ẢNH NỀN SÓNG NƯỚC */
    .water-bg-layer {
      position: fixed;
      inset: -15px;
      background-color: #04101e;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: saturate(1.2) contrast(1.1);
      z-index: 1;
      animation: waterUndulate 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes waterUndulate {
      0% { transform: scale(1.02); }
      100% { transform: scale(1.06) translateY(-8px); }
    }

    /* CANVAS HIỆU ỨNG SÓNG NƯỚC KHI CHẠM & HOA HỒNG RƠI */
    #fxCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: auto;
    }

    /* LỚP PHỦ VIGNETTE NGHỆ THUẬT */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      background: radial-gradient(circle at center, transparent 38%, rgba(2, 6, 12, 0.82) 100%);
    }

    /* KHUNG GIAO DIỆN CHÍNH */
    .main-wrapper {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 34px 45px;
      pointer-events: none;
    }

    /* THANH TRÊN CÙNG */
    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .site-tag {
      font-family: var(--font-top-tag);
      font-size: 0.72rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(220, 245, 255, 0.9);
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.55);
    }

    /* ĐĨA NHẠC MÀU LAM (BLUE VINYL RECORD) */
    .vinyl-player-box {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      background: rgba(6, 20, 32, 0.55);
      padding: 6px 14px 6px 8px;
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.35s ease;
    }

    .vinyl-player-box:hover {
      border-color: var(--crystal-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
      transform: translateY(-2px);
    }

    .vinyl-disc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      position: relative;
      background: repeating-radial-gradient(
        circle,
        #0b2942 0px,
        #0b2942 2px,
        #031422 3px,
        #123e61 4px
      );
      box-shadow: 0 0 12px rgba(0, 195, 255, 0.4), inset 0 0 4px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-center-label {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #a2edff 0%, #0077b6 70%, #023e8a 100%);
      box-shadow: 0 0 5px rgba(0, 240, 255, 0.8);
      position: relative;
    }

    .vinyl-center-label::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #030b14;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .vinyl-disc.spinning {
      animation: spinVinyl 3.5s linear infinite;
    }

    @keyframes spinVinyl {
      100% { transform: rotate(360deg); }
    }

    .vinyl-text {
      font-family: var(--font-top-tag);
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(220, 245, 255, 0.85);
    }

    /* KHU VỰC TRUNG TÂM */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
      pointer-events: auto;
      max-width: 680px;
    }

    /* BỨC ẢNH LƠ LỬNG Ở GIỮA (FLOATING PICTURE CARD) */
    .floating-card-wrapper {
      position: relative;
      cursor: pointer;
      animation: floatSmooth 6s ease-in-out infinite;
      perspective: 1000px;
    }

    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(0.6deg); }
    }

    .floating-picture-frame {
      width: 250px;
      height: 330px;
      padding: 10px;
      background: linear-gradient(145deg, rgba(230, 250, 255, 0.3) 0%, rgba(15, 45, 70, 0.6) 50%, rgba(4, 18, 30, 0.85) 100%);
      border: 1.5px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(14px);
      box-shadow: 
        inset 0 0 25px rgba(255, 255, 255, 0.25),
        0 20px 50px rgba(0, 0, 0, 0.65),
        0 0 45px rgba(0, 210, 255, 0.35);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .floating-card-wrapper:hover .floating-picture-frame {
      transform: scale(1.035) translateY(-3px);
      border-color: #ffffff;
      box-shadow: 
        inset 0 0 35px rgba(255, 255, 255, 0.4),
        0 25px 65px rgba(0, 0, 0, 0.8),
        0 0 60px rgba(0, 240, 255, 0.6);
    }

    .floating-picture-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
    }

    /* DÒNG CÂU NÓI QUOTE */
    .quote-text {
      font-family: var(--font-quote);
      font-style: italic;
      font-size: clamp(1.6rem, 3.4vw, 2.3rem);
      font-weight: 400;
      color: #ffffff;
      line-height: 1.35;
      margin-top: 24px;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.7), 0 2px 4px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
    }

    /* DÒNG TIÊU ĐỀ LỚN */
    .brand-title {
      font-family: var(--font-brand);
      font-size: 0.76rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(190, 240, 255, 0.9);
      margin-top: 12px;
      margin-bottom: 26px;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    /* NÚT BẤM "XEM BÁO ỨNG" */
    .btn-action-enter {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 13px 40px;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.24) 0%, rgba(18, 48, 80, 0.75) 50%, rgba(140, 45, 220, 0.28) 100%);
      border: 1.5px solid rgba(190, 240, 255, 0.45);
      border-radius: 40px;
      color: #ffffff;
      font-family: var(--font-button);
      font-size: 1.25rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      box-shadow: 
        inset 0 0 25px rgba(255, 255, 255, 0.25),
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(0, 240, 255, 0.35);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-action-enter:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #ffffff;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.42) 0%, rgba(28, 75, 120, 0.9) 50%, rgba(160, 50, 240, 0.42) 100%);
      box-shadow: 
        inset 0 0 30px rgba(255, 255, 255, 0.45),
        0 15px 45px rgba(0, 0, 0, 0.7),
        0 0 45px rgba(0, 240, 255, 0.75);
    }

    .btn-action-enter .sparkle-icon {
      font-size: 1.1rem;
      color: var(--crystal-cyan);
      text-shadow: 0 0 10px var(--crystal-cyan);
    }

    .btn-action-enter .arrow-svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      transition: transform 0.3s ease;
    }

    .btn-action-enter:hover .arrow-svg {
      transform: translateX(5px);
    }

    /* DÒNG HINT CHẠM ĐỂ MỞ */
    .tap-hint {
      font-family: var(--font-hint);
      font-size: 0.65rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(200, 240, 255, 0.65);
      margin-top: 14px;
      animation: pulseHint 2.5s infinite ease-in-out;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.95; }
    }

    @media (max-width: 600px) {
      .floating-picture-frame {
        width: 200px;
        height: 270px;
      }
      .quote-text {
        font-size: 1.4rem;
      }
      .btn-action-enter {
        padding: 12px 30px;
        font-size: 1.12rem;
      }
    }
  </style>
</head>
<body>

  <!-- Lớp ảnh nền sóng nước -->
  <div class="water-bg-layer" id="waterBg"></div>

  <!-- Canvas sóng nước tương tác & Hoa hồng xanh rơi -->
  <canvas id="fxCanvas"></canvas>

  <!-- Lớp phủ viền tối nghệ thuật -->
  <div class="vignette-overlay"></div>

  <!-- Giao diện chính -->
  <div class="main-wrapper">

    <!-- Thanh trên cùng -->
    <header class="top-bar">
      <div class="site-tag">✦ BÁO ỨNG ĐỜI NHAU • ARCHIVE 2026</div>

      <!-- ĐĨA NHẠC MÀU LAM -->
      <div class="vinyl-player-box" id="vinylPlayer" title="Nhấp để bật / tắt nhạc">
        <div class="vinyl-disc" id="vinylDisc">
          <div class="vinyl-center-label"></div>
        </div>
        <span class="vinyl-text" id="vinylText">Âm Nhạc</span>
      </div>
    </header>

    <!-- Khu vực trung tâm: Bức ảnh lơ lửng + Dòng chữ + Nút Xem báo ứng -->
    <div class="center-stage">
      
      <!-- BỨC ẢNH LƠ LỬNG Ở GIỮA -->
      <div class="floating-card-wrapper" id="cardWrapper">
        <div class="floating-picture-frame">
          <img src="" id="centerImg" alt="Bức ảnh lơ lửng">
        </div>
      </div>

      <!-- Dòng quote -->
      <h1 class="quote-text">“What is grief, if not love persevering?”</h1>

      <!-- Dòng brand title -->
      <div class="brand-title">B Á O   Ứ N G   Đ Ờ I   N H A U</div>

      <!-- Khối chữ nhật "Xem báo ứng" -->
      <button class="btn-action-enter" id="btnEnter">
        <span class="sparkle-icon">❖</span>
        <span>Xem báo ứng</span>
        <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <div class="tap-hint">C H Ạ M   Đ Ể   M Ở</div>
    </div>

    <div></div>

  </div>

  <script>
    /* ==========================================================================
       ✦ 2. KHU VỰC DÁN LINK ẢNH CỦA BẠN (DÁN LINK VÀO GIỮA CẶP DẤU '...') ✦
       ========================================================================== */
    const MY_CONFIG = {
      // 1. Dán link ảnh nền sóng nước cá bơi ở đây (hoặc tên file 'bg.jpg'):
      backgroundImageUrl: 'https://www.pixelstalk.net/wp-content/uploads/2025/05/Swirling-schools-of-fish-shimmering-in-deep-blue-sea.webp',

      // 2. Dán link bức ảnh lơ lửng ở giữa ở đây:
      centerPictureUrl: 'https://i.pinimg.com/736x/90/e6/aa/90e6aa0bc289c51d64f54771058b65b6.jpg',

      // 3. Link file nhạc mp3 (Nếu để trống thì tự động phát tiếng sóng biển du dương):
      musicMp3Url: ''
    };

    // Áp dụng link ảnh vào giao diện
    const waterBg = document.getElementById('waterBg');
    const centerImg = document.getElementById('centerImg');

    waterBg.style.backgroundImage = `radial-gradient(circle at 50% 50%, rgba(0, 140, 200, 0.22) 0%, rgba(2, 8, 16, 0.88) 100%), url('${MY_CONFIG.backgroundImageUrl}')`;
    centerImg.src = MY_CONFIG.centerPictureUrl;

    // Tương tác nghiêng 3D nhẹ của bức ảnh khi rê chuột
    const cardWrapper = document.getElementById('cardWrapper');
    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      cardWrapper.style.transform = `perspective(1000px) rotateY(${x * 9}deg) rotateX(${-y * 9}deg)`;
    });

    /* ==========================================================================
       ✦ 3. ĐĨA NHẠC MÀU LAM & ÂM THANH SÓNG BIỂN
       ========================================================================== */
    const vinylPlayer = document.getElementById('vinylPlayer');
    const vinylDisc = document.getElementById('vinylDisc');
    const vinylText = document.getElementById('vinylText');

    let audioCtx = null, oceanGain = null, isPlaying = false;
    let customAudio = null;

    if (MY_CONFIG.musicMp3Url.trim() !== '') {
      customAudio = new Audio(MY_CONFIG.musicMp3Url);
      customAudio.loop = true;
    }

    function toggleMusic() {
      isPlaying = !isPlaying;

      if (isPlaying) {
        vinylDisc.classList.add('spinning');
        vinylText.textContent = "Đang Phát";
        vinylText.style.color = "var(--crystal-cyan)";

        if (customAudio) {
          customAudio.play().catch(() => {
            initOceanSound();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            oceanGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 1.5);
          });
        } else {
          initOceanSound();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          oceanGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 1.5);
        }
      } else {
        vinylDisc.classList.remove('spinning');
        vinylText.textContent = "Tạm Dừng";
        vinylText.style.color = "rgba(220, 245, 255, 0.85)";

        if (customAudio) {
          customAudio.pause();
        } else if (oceanGain) {
          oceanGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
        }
      }
    }

    function initOceanSound() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      oceanGain = audioCtx.createGain();
      oceanGain.gain.setValueAtTime(0, audioCtx.currentTime);
      oceanGain.connect(audioCtx.destination);

      const bufferSize = audioCtx.sampleRate * 3;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.08;

      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(260, audioCtx.currentTime);

      const lfo = audioCtx.createOscillator();
      lfo.frequency.setValueAtTime(0.12, audioCtx.currentTime);
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.setValueAtTime(300, audioCtx.currentTime);
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      noise.connect(filter);
      filter.connect(oceanGain);
      noise.start();
      lfo.start();
    }

    vinylPlayer.addEventListener('click', toggleMusic);

    /* ==========================================================================
       ✦ 4. CÁNH HOA HỒNG XANH SIÊU THỰC (REALISTIC BOTANICAL BLUE ROSE ENGINE)
       ========================================================================== */
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');

    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    // Sóng nước lan tỏa
    const ripples = [];
    function makeRipple(x, y) {
      ripples.push({ x, y, r: 4, maxR: Math.min(w, h) * 0.35 + 40, alpha: 0.9, speed: 2.8 });
      setTimeout(() => {
        ripples.push({ x, y, r: 2, maxR: Math.min(w, h) * 0.25, alpha: 0.6, speed: 2.2 });
      }, 150);
    }

    window.addEventListener('pointerdown', (e) => makeRipple(e.clientX, e.clientY));

    // LỚP VẼ CÁNH HOA HỒNG XANH CHÂN THẬT
    const flowers = [];
    const NUM_FLOWERS = 28;

    class HyperRealisticBluePetal {
      constructor(initRandomY = false) {
        this.reset(initRandomY);
      }

      reset(initRandomY = false) {
        this.x = Math.random() * w;
        this.y = initRandomY ? Math.random() * h : -50;
        this.size = 18 + Math.random() * 22; // Cỡ cánh hoa thực tế
        this.speedY = 0.55 + Math.random() * 0.75;
        this.speedX = (Math.random() - 0.5) * 0.45;

        // Góc xoay 3D theo không khí (Pitch, Yaw, Roll)
        this.roll = Math.random() * Math.PI * 2;
        this.rollSpeed = (Math.random() - 0.5) * 0.015;
        this.pitch = Math.random() * Math.PI * 2;
        this.pitchSpeed = 0.018 + Math.random() * 0.02;
        this.yaw = (Math.random() - 0.5) * 0.35;

        this.swayAngle = Math.random() * Math.PI * 2;
        this.swaySpeed = 0.012 + Math.random() * 0.018;

        this.opacity = 0.85 + Math.random() * 0.15;

        // 3 dạng hoa: Cánh hoa đơn lật cuộn (70%), Cánh hoa kép (15%), Đóa hoa hồng tuyết nhỏ (15%)
        const randType = Math.random();
        if (randType < 0.70) {
          this.petalType = 'single';
        } else if (randType < 0.85) {
          this.petalType = 'double';
        } else {
          this.petalType = 'rosebud';
        }
      }

      update() {
        this.swayAngle += this.swaySpeed;
        this.pitch += this.pitchSpeed;
        this.roll += this.rollSpeed;

        this.y += this.speedY + Math.cos(this.pitch) * 0.15;
        this.x += Math.sin(this.swayAngle) * 0.8 + this.speedX;

        // Khi cánh hoa chạm mặt nước
        if (this.y > h + 50) {
          if (Math.random() > 0.45) makeRipple(this.x, h - 20);
          this.reset(false);
        }
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);

        // Biến dạng xoay 3 chiều mô phỏng cánh hoa lượn trong không khí
        const cosP = Math.cos(this.pitch);
        const sinR = Math.sin(this.roll);
        c.rotate(this.roll);
        c.scale(1 + sinR * 0.15, Math.abs(cosP) * 0.8 + 0.2);

        // Bóng đổ mờ dưới làn nước tạo chiều sâu 3D
        c.shadowColor = 'rgba(2, 10, 20, 0.45)';
        c.shadowBlur = 10;
        c.shadowOffsetY = 6;
        c.globalAlpha = this.opacity;

        if (this.petalType === 'single') {
          this.drawBotanicalSinglePetal(c, this.size, cosP > 0);
        } else if (this.petalType === 'double') {
          this.drawOverlappingPetals(c, this.size);
        } else {
          this.drawRealisticRoseBloom(c, this.size * 0.95);
        }

        c.restore();
      }

      // 1. CÁNH HOA HỒNG ĐƠN TỰ NHIÊN: Có độ uốn, mép lật, sống lưng và gân mờ
      drawBotanicalSinglePetal(c, s, isFrontFace) {
        c.beginPath();
        // Cuống đáy cánh hoa
        c.moveTo(0, s * 0.8);
        // Đường lượn bụng trái
        c.bezierCurveTo(-s * 0.75, s * 0.5, -s * 0.9, -s * 0.2, -s * 0.45, -s * 0.75);
        // Chóp đỉnh cánh hoa gợn sóng hình trái tim nhẹ
        c.bezierCurveTo(-s * 0.2, -s * 0.95, 0, -s * 0.82, s * 0.2, -s * 0.95);
        // Đường lượn bụng phải
        c.bezierCurveTo(s * 0.9, -s * 0.2, s * 0.75, s * 0.5, 0, s * 0.8);

        // Gradient ombre chất nhung chân thực của hoa hồng xanh (từ ảnh 3)
        const grad = c.createRadialGradient(0, s * 0.2, s * 0.1, 0, -s * 0.1, s * 1.1);
        if (isFrontFace) {
          // Mặt trước: nhung xanh đậm sang lam ngọc và ánh tuyết
          grad.addColorStop(0, '#0a233c');      // Cuống cánh hoa xanh thẫm
          grad.addColorStop(0.35, '#174a75');   // Lòng cánh màu xanh biển sâu
          grad.addColorStop(0.75, '#358fc5');   // Thân cánh xanh lam
          grad.addColorStop(0.95, '#82d3f8');   // Viền bắt sáng
          grad.addColorStop(1, '#dcf4ff');      // Mép mỏng ánh tuyết
        } else {
          // Mặt sau: nhạt màu hơn và hơi mờ sương
          grad.addColorStop(0, '#0d2d4c');
          grad.addColorStop(0.4, '#1e5f91');
          grad.addColorStop(0.85, '#56b1df');
          grad.addColorStop(1, '#bfeaff');
        }

        c.fillStyle = grad;
        c.fill();

        // Mép cánh hoa uốn gập ra sau (Curled Petal Lip)
        c.beginPath();
        c.moveTo(-s * 0.45, -s * 0.75);
        c.quadraticCurveTo(0, -s * 0.65, s * 0.45, -s * 0.75);
        c.quadraticCurveTo(0, -s * 0.85, -s * 0.45, -s * 0.75);
        c.fillStyle = 'rgba(215, 246, 255, 0.45)';
        c.fill();

        // Gân hoa tơ mềm mỏng
        c.strokeStyle = 'rgba(210, 245, 255, 0.28)';
        c.lineWidth = 0.9;
        c.beginPath();
        c.moveTo(0, s * 0.65);
        c.quadraticCurveTo(s * 0.08, 0, 0, -s * 0.7);
        c.moveTo(-s * 0.05, s * 0.1);
        c.quadraticCurveTo(-s * 0.35, -s * 0.15, -s * 0.5, -s * 0.4);
        c.moveTo(s * 0.05, s * 0.1);
        c.quadraticCurveTo(s * 0.35, -s * 0.15, s * 0.5, -s * 0.4);
        c.stroke();

        // Viền ánh sương nhẹ ở rìa
        c.strokeStyle = 'rgba(235, 250, 255, 0.5)';
        c.lineWidth = 0.6;
        c.stroke();
      }

      // 2. CÁNH HOA KÉP (2 cánh lồng vào nhau lượn trong gió)
      drawOverlappingPetals(c, s) {
        c.save();
        c.rotate(-0.25);
        this.drawBotanicalSinglePetal(c, s * 0.85, false);
        c.restore();

        c.save();
        c.rotate(0.35);
        c.translate(s * 0.15, 0);
        this.drawBotanicalSinglePetal(c, s, true);
        c.restore();
      }

      // 3. ĐÓA HOA HỒNG XANH NHỎ NỞ TẦNG LỚP (Rosebud/Full Bloom tự nhiên)
      drawRealisticRoseBloom(c, s) {
        const layers = 5;
        // Vẽ từ các cánh xòe ngoài cùng vào nụ tâm
        for (let i = layers; i >= 1; i--) {
          const r = s * (i / layers);
          c.save();
          c.rotate(i * 1.45 + (this.roll * 0.3));

          c.beginPath();
          c.moveTo(0, r * 0.85);
          c.bezierCurveTo(-r * 0.85, r * 0.6, -r * 0.95, -r * 0.3, 0, -r * 0.95);
          c.bezierCurveTo(r * 0.95, -r * 0.3, r * 0.85, r * 0.6, 0, r * 0.85);

          const grad = c.createRadialGradient(0, 0, 1, 0, -r * 0.2, r * 0.9);
          if (i === 1) {
            // Nhụy cuộn chính giữa màu lam tuyết
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.5, '#76cff9');
            grad.addColorStop(1, '#1b5b8d');
          } else {
            // Các cánh xoắn ngoài
            grad.addColorStop(0, '#0a233b');
            grad.addColorStop(0.55, '#216b9e');
            grad.addColorStop(0.9, '#63bfe8');
            grad.addColorStop(1, '#d5f3ff');
          }

          c.fillStyle = grad;
          c.fill();

          c.strokeStyle = 'rgba(225, 248, 255, 0.4)';
          c.lineWidth = 0.7;
          c.stroke();

          c.restore();
        }
      }
    }

    for (let i = 0; i < NUM_FLOWERS; i++) {
      flowers.push(new HyperRealisticBluePetal(true));
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, w, h);

      // Vẽ sóng nước lan tỏa
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rip = ripples[i];
        rip.r += rip.speed;
        rip.alpha -= 0.01;

        if (rip.alpha <= 0 || rip.r >= rip.maxR) {
          ripples.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(rip.x, rip.y, rip.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(130, 235, 255, ${rip.alpha * 0.85})`;
        ctx.lineWidth = 2.2;
        ctx.shadowColor = 'rgba(0, 240, 255, 0.65)';
        ctx.shadowBlur = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(rip.x, rip.y, Math.max(0, rip.r - 8), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(180, 80, 255, ${rip.alpha * 0.4})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();
      }

      // Vẽ hoa và cánh hoa hồng xanh siêu thực
      flowers.forEach(f => {
        f.update();
        f.draw(ctx);
      });

      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    // Nút Xem báo ứng
    const btnEnter = document.getElementById('btnEnter');
    btnEnter.addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = btnEnter.getBoundingClientRect();
      makeRipple(rect.left + rect.width / 2, rect.top + rect.height / 2);
      alert("✦ ĐÃ KÍCH HOẠT: XEM BÁO ỨNG ✦\n(Giao diện mở đầu đã hoàn thành xuất sắc chuẩn theo ý bạn!)");
    });
  </script>
