<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo Ứng Đời Nhau</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oregano:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Cinzel:wght@400;600&family=Alex+Brush&family=Playfair+Display:ital,wght@0,500;1,500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ✦ 1. KHU VỰC TỰ ĐỔI FONT CHỮ CHO TỪNG DÒNG ✦
       ========================================================================== */
    :root {
      /* Dòng 1: Tiêu đề nhỏ trên cùng */
      --font-top-tag: 'Oregano';

      /* Dòng 2: Dòng câu nói “What is grief, if not love persevering?” */
      --font-quote:     'Cormorant Garamond', 'Oregano';

      /* Dòng 3: Dòng chữ lớn (B Á O   Ứ N G   Đ Ờ I   N H A U) */
      --font-brand: 'Oregano';

      /* Dòng 4: Chữ trên nút "Xem báo ứng" */
      --font-button:    'Cormorant Garamond', 'Oregano';

      /* Dòng 5: Dòng chữ nhỏ nhấp nháy "C H Ạ M   Đ Ể   M Ở" */
      --font-hint: 'Oregano';

      /* Bảng màu chủ đạo */
      --crystal-cyan: #00f0ff;
      --crystal-blue: #0066ff;
      --antique-cream: #f6f1e8;
      --glass-border: rgba(200, 240, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030b14;
      color: var(--antique-cream);
    }

    /* ẢNH NỀN SÓNG NƯỚC */
    .water-bg-layer {
      position: fixed;
      inset: -15px;
      background-color: #04101e;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: saturate(1.2) contrast(1.1);
      z-index: 1;
      animation: waterUndulate 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes waterUndulate {
      0% { transform: scale(1.02); }
      100% { transform: scale(1.06) translateY(-8px); }
    }

    /* CANVAS HIỆU ỨNG SÓNG NƯỚC KHI CHẠM & HOA HỒNG MỀM RƠI */
    #fxCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: auto;
    }

    /* LỚP PHỦ VIGNETTE NGHỆ THUẬT */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      background: radial-gradient(circle at center, transparent 38%, rgba(2, 6, 12, 0.82) 100%);
    }

    /* KHUNG GIAO DIỆN CHÍNH */
    .main-wrapper {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 34px 45px;
      pointer-events: none;
    }

    /* THANH TRÊN CÙNG */
    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .site-tag {
      font-family: var(--font-top-tag);
      font-size: 0.72rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(220, 245, 255, 0.9);
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.55);
    }

    /* ĐĨA NHẠC MÀU LAM */
    .vinyl-player-box {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      background: rgba(6, 20, 32, 0.55);
      padding: 6px 14px 6px 8px;
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.35s ease;
    }

    .vinyl-player-box:hover {
      border-color: var(--crystal-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
      transform: translateY(-2px);
    }

    .vinyl-disc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      position: relative;
      background: repeating-radial-gradient(
        circle,
        #0b2942 0px,
        #0b2942 2px,
        #031422 3px,
        #123e61 4px
      );
      box-shadow: 0 0 12px rgba(0, 195, 255, 0.4), inset 0 0 4px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-center-label {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #a2edff 0%, #0077b6 70%, #023e8a 100%);
      box-shadow: 0 0 5px rgba(0, 240, 255, 0.8);
      position: relative;
    }

    .vinyl-center-label::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #030b14;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .vinyl-disc.spinning {
      animation: spinVinyl 3.5s linear infinite;
    }

    @keyframes spinVinyl {
      100% { transform: rotate(360deg); }
    }

    .vinyl-text {
      font-family: var(--font-top-tag);
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(220, 245, 255, 0.85);
    }

    /* KHU VỰC TRUNG TÂM */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
      pointer-events: auto;
      max-width: 680px;
    }

    /* BỨC ẢNH LƠ LỬNG Ở GIỮA */
    .floating-card-wrapper {
      position: relative;
      cursor: pointer;
      animation: floatSmooth 6s ease-in-out infinite;
      perspective: 1000px;
    }

    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(0.6deg); }
    }

    .floating-picture-frame {
      width: 250px;
      height: 330px;
      padding: 10px;
      background: linear-gradient(145deg, rgba(230, 250, 255, 0.3) 0%, rgba(15, 45, 70, 0.6) 50%, rgba(4, 18, 30, 0.85) 100%);
      border: 1.5px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(14px);
      box-shadow: 
        inset 0 0 25px rgba(255, 255, 255, 0.25),
        0 20px 50px rgba(0, 0, 0, 0.65),
        0 0 45px rgba(0, 210, 255, 0.35);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .floating-card-wrapper:hover .floating-picture-frame {
      transform: scale(1.035) translateY(-3px);
      border-color: #ffffff;
      box-shadow: 
        inset 0 0 35px rgba(255, 255, 255, 0.4),
        0 25px 65px rgba(0, 0, 0, 0.8),
        0 0 60px rgba(0, 240, 255, 0.6);
    }

    .floating-picture-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
    }

    /* DÒNG CÂU NÓI QUOTE */
    .quote-text {
      font-family: var(--font-quote);
      font-style: italic;
      font-size: clamp(1.6rem, 3.4vw, 2.3rem);
      font-weight: 400;
      color: #ffffff;
      line-height: 1.35;
      margin-top: 24px;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.7), 0 2px 4px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
    }

    /* DÒNG TIÊU ĐỀ LỚN */
    .brand-title {
      font-family: var(--font-brand);
      font-size: 0.76rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(190, 240, 255, 0.9);
      margin-top: 12px;
      margin-bottom: 26px;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    /* NÚT BẤM "XEM BÁO ỨNG" */
    .btn-action-enter {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 13px 40px;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.24) 0%, rgba(18, 48, 80, 0.75) 50%, rgba(140, 45, 220, 0.28) 100%);
      border: 1.5px solid rgba(190, 240, 255, 0.45);
      border-radius: 40px;
      color: #ffffff;
      font-family: var(--font-button);
      font-size: 1.25rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      box-shadow: 
        inset 0 0 25px rgba(255, 255, 255, 0.25),
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(0, 240, 255, 0.35);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-action-enter:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #ffffff;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.42) 0%, rgba(28, 75, 120, 0.9) 50%, rgba(160, 50, 240, 0.42) 100%);
      box-shadow: 
        inset 0 0 30px rgba(255, 255, 255, 0.45),
        0 15px 45px rgba(0, 0, 0, 0.7),
        0 0 45px rgba(0, 240, 255, 0.75);
    }

    .btn-action-enter .sparkle-icon {
      font-size: 1.1rem;
      color: var(--crystal-cyan);
      text-shadow: 0 0 10px var(--crystal-cyan);
    }

    .btn-action-enter .arrow-svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      transition: transform 0.3s ease;
    }

    .btn-action-enter:hover .arrow-svg {
      transform: translateX(5px);
    }

    /* DÒNG HINT CHẠM ĐỂ MỞ */
    .tap-hint {
      font-family: var(--font-hint);
      font-size: 0.65rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(200, 240, 255, 0.65);
      margin-top: 14px;
      animation: pulseHint 2.5s infinite ease-in-out;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.95; }
    }

    @media (max-width: 600px) {
      .floating-picture-frame {
        width: 200px;
        height: 270px;
      }
      .quote-text {
        font-size: 1.4rem;
      }
      .btn-action-enter {
        padding: 12px 30px;
        font-size: 1.12rem;
      }
    }
  </style>
</head>
<body>

  <!-- Lớp ảnh nền sóng nước -->
  <div class="water-bg-layer" id="waterBg"></div>

  <!-- Canvas sóng nước tương tác & Hoa hồng rơi -->
  <canvas id="fxCanvas"></canvas>

  <!-- Lớp phủ viền tối nghệ thuật -->
  <div class="vignette-overlay"></div>

  <!-- Giao diện chính -->
  <div class="main-wrapper">

    <!-- Thanh trên cùng -->
    <header class="top-bar">
      <div class="site-tag">✦ BÁO ỨNG • ARCHIVE</div>

      <!-- ĐĨA NHẠC MÀU LAM -->
      <div class="vinyl-player-box" id="vinylPlayer" title="Nhấp để bật / tắt nhạc">
        <div class="vinyl-disc" id="vinylDisc">
          <div class="vinyl-center-label"></div>
        </div>
        <span class="vinyl-text" id="vinylText">Em bé</span>
      </div>
    </header>

    <!-- Khu vực trung tâm: Bức ảnh lơ lửng + Dòng chữ + Nút Xem báo ứng -->
    <div class="center-stage">
      
      <!-- BỨC ẢNH LƠ LỬNG Ở GIỮA -->
      <div class="floating-card-wrapper" id="cardWrapper">
        <div class="floating-picture-frame">
          <img src="" id="centerImg" alt="Bức ảnh lơ lửng">
        </div>
      </div>

      <!-- Dòng quote -->
      <h1 class="quote-text">“What is grief, if not love persevering?”</h1>

      <!-- Dòng brand title -->
      <div class="brand-title">B Á O   Ứ N G   Đ Ờ I   N H A U</div>

      <!-- Khối chữ nhật "Xem báo ứng" -->
      <button class="btn-action-enter" id="btnEnter">
        <span class="sparkle-icon">❖</span>
        <span>Xem báo ứng</span>
        <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <div class="tap-hint">C H Ạ M   Đ Ể   M Ở</div>
    </div>

    <div></div>

  </div>

  <script>
    /* ==========================================================================
       ✦ 2. KHU VỰC DÁN LINK ẢNH CỦA BẠN ✦
       ========================================================================== */
    const MY_CONFIG = {
      // 1. Link ảnh nền:
      backgroundImageUrl: 'https://www.pixelstalk.net/wp-content/uploads/2025/05/Swirling-schools-of-fish-shimmering-in-deep-blue-sea.webp',

      // 2. Link ảnh lơ lửng ở giữa:
      centerPictureUrl: 'https://i.pinimg.com/736x/90/e6/aa/90e6aa0bc289c51d64f54771058b65b6.jpg',

      // 3. Link file nhạc mp3:
      musicMp3Url: 'https://open.spotify.com/playlist/5jZ5if9qoRWvhSYWm4SOr0?si=e4pxqy-CTc6luLS135FYYw',

      // 4. (TÙY CHỌN) LINK ẢNH ĐÓA HOA HỒNG THẬT CẮT NỀN TRONG SUỐT (.PNG):
      // Nếu bạn có link ảnh hoa hồng thật cắt nền, dán vào đây để nó dùng thẳng ảnh thật!
      // Nếu để trống '', web sẽ tự vẽ những đóa hoa hồng lụa mềm mại trong veo bên dưới.
      roseImageUrl: 'https://media.discordapp.net/attachments/1255689844584087583/1570539154306109481/OIP-removebg-preview.png?ex=6af77611&is=6af62491&hm=93a0cd8dfec78e362368d71c1078f78936177d22d99a811a99f819757f8e88a3&=&format=webp&quality=lossless'
    };

    // Gán ảnh
    const waterBg = document.getElementById('waterBg');
    const centerImg = document.getElementById('centerImg');

    waterBg.style.backgroundImage = `radial-gradient(circle at 50% 50%, rgba(0, 140, 200, 0.22) 0%, rgba(2, 8, 16, 0.88) 100%), url('${MY_CONFIG.backgroundImageUrl}')`;
    centerImg.src = MY_CONFIG.centerPictureUrl;

    // Tương tác nghiêng 3D của bức ảnh khi rê chuột
    const cardWrapper = document.getElementById('cardWrapper');
    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      cardWrapper.style.transform = `perspective(1000px) rotateY(${x * 9}deg) rotateX(${-y * 9}deg)`;
    });

    /* ==========================================================================
       ✦ 3. ĐĨA NHẠC MÀU LAM & ÂM THANH SÓNG BIỂN
       ========================================================================== */
    const vinylPlayer = document.getElementById('vinylPlayer');
    const vinylDisc = document.getElementById('vinylDisc');
    const vinylText = document.getElementById('vinylText');

    let audioCtx = null, oceanGain = null, isPlaying = false;
    let customAudio = null;

    if (MY_CONFIG.musicMp3Url.trim() !== '') {
      customAudio = new Audio(MY_CONFIG.musicMp3Url);
      customAudio.loop = true;
    }

    function toggleMusic() {
      isPlaying = !isPlaying;

      if (isPlaying) {
        vinylDisc.classList.add('spinning');
        vinylText.textContent = "Đang Phát";
        vinylText.style.color = "var(--crystal-cyan)";

        if (customAudio) {
          customAudio.play().catch(() => {
            initOceanSound();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            oceanGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 1.5);
          });
        } else {
          initOceanSound();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          oceanGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 1.5);
        }
      } else {
        vinylDisc.classList.remove('spinning');
        vinylText.textContent = "Tạm Dừng";
        vinylText.style.color = "rgba(220, 245, 255, 0.85)";

        if (customAudio) {
          customAudio.pause();
        } else if (oceanGain) {
          oceanGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
        }
      }
    }

    function initOceanSound() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      oceanGain = audioCtx.createGain();
      oceanGain.gain.setValueAtTime(0, audioCtx.currentTime);
      oceanGain.connect(audioCtx.destination);

      const bufferSize = audioCtx.sampleRate * 3;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.08;

      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(260, audioCtx.currentTime);

      const lfo = audioCtx.createOscillator();
      lfo.frequency.setValueAtTime(0.12, audioCtx.currentTime);
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.setValueAtTime(300, audioCtx.currentTime);
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      noise.connect(filter);
      filter.connect(oceanGain);
      noise.start();
      lfo.start();
    }

    vinylPlayer.addEventListener('click', toggleMusic);

    /* ==========================================================================
       ✦ 4. SÓNG NƯỚC KHI CHẠM ✦
       ========================================================================== */
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');

    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const ripples = [];
    function makeRipple(x, y) {
      ripples.push({ x, y, r: 4, maxR: Math.min(w, h) * 0.35 + 40, alpha: 0.9, speed: 2.8 });
      setTimeout(() => {
        ripples.push({ x, y, r: 2, maxR: Math.min(w, h) * 0.25, alpha: 0.6, speed: 2.2 });
      }, 150);
    }

    window.addEventListener('pointerdown', (e) => makeRipple(e.clientX, e.clientY));

    // Nạp ảnh hoa ngoài nếu người dùng có dán link
    let customRoseImg = null;
    let isCustomRoseLoaded = false;
    if (MY_CONFIG.roseImageUrl && MY_CONFIG.roseImageUrl.trim() !== '') {
      customRoseImg = new Image();
      customRoseImg.crossOrigin = 'anonymous';
      customRoseImg.src = MY_CONFIG.roseImageUrl;
      customRoseImg.onload = () => { isCustomRoseLoaded = true; };
    }

    /* ==========================================================================
       ✦ 5. VẼ ĐÓA HOA HỒNG VÀ CÁNH HOA LỤA MỀM MẠI (KHÔNG CÒN ĐÀI HOA KỲ CỤC) ✦
       ========================================================================== */
    // 1. SPRITE ĐÓA HOA HỒNG NỞ BUNG MỀM MẠI
    const roseBloomCanvas = document.createElement('canvas');
    roseBloomCanvas.width = roseBloomCanvas.height = 260;
    const bCtx = roseBloomCanvas.getContext('2d');

    (function drawSoftBloom() {
      const cx = 130, cy = 130;

      // Hàm vẽ một cánh hoa lụa mềm
      function drawPetal(angle, dist, rx, ry, c1, c2, c3) {
        bCtx.save();
        bCtx.translate(cx, cy);
        bCtx.rotate(angle);
        bCtx.beginPath();
        bCtx.moveTo(0, -dist);
        bCtx.bezierCurveTo(-rx * 0.7, -dist - ry * 0.35, -rx, -dist + ry * 0.55, 0, -dist + ry);
        bCtx.bezierCurveTo(rx, -dist + ry * 0.55, rx * 0.7, -dist - ry * 0.35, 0, -dist);

        const g = bCtx.createRadialGradient(0, -dist + ry * 0.2, 2, 0, -dist + ry * 0.2, rx);
        g.addColorStop(0, c1);
        g.addColorStop(0.6, c2);
        g.addColorStop(0.95, c3);
        g.addColorStop(1, 'rgba(235, 252, 255, 0.95)');
        bCtx.fillStyle = g;
        bCtx.shadowColor = 'rgba(5, 35, 65, 0.25)';
        bCtx.shadowBlur = 8;
        bCtx.fill();
        bCtx.strokeStyle = 'rgba(230, 250, 255, 0.7)';
        bCtx.lineWidth = 0.8;
        bCtx.stroke();
        bCtx.restore();
      }

      // Tầng cánh ngoài cùng (Màu xanh pastel viền sương)
      for (let i = 0; i < 7; i++) {
        drawPetal((i * Math.PI * 2) / 7, 34, 48, 56, '#469fe6', '#7ecbfc', '#d4f3ff');
      }
      // Tầng cánh giữa xếp so le
      for (let i = 0; i < 6; i++) {
        drawPetal((i * Math.PI * 2) / 6 + 0.45, 20, 36, 42, '#2d8fdc', '#60bdfa', '#bee8ff');
      }
      // Tầng cánh trong ôm nụ
      for (let i = 0; i < 5; i++) {
        drawPetal((i * Math.PI * 2) / 5 + 0.8, 10, 25, 30, '#1c7ecf', '#44a9f3', '#a7deff');
      }
      // Nụ xoắn ốc tâm hoa
      for (let s = 0; s < 7; s++) {
        bCtx.save();
        bCtx.translate(cx, cy);
        bCtx.rotate(s * 0.88);
        const r = 20 - s * 2.6;
        bCtx.beginPath();
        bCtx.arc(0, 0, Math.max(2, r), 0.1, Math.PI * 1.55);
        bCtx.strokeStyle = `rgba(235, 252, 255, ${0.9 - s * 0.08})`;
        bCtx.lineWidth = 1.8 - s * 0.14;
        bCtx.stroke();
        bCtx.fillStyle = s % 2 === 0 ? '#389fe8' : '#69c5fc';
        bCtx.fill();
        bCtx.restore();
      }
    })();

    // 2. SPRITE CÁNH HOA ĐƠN LẢ TẢ RƠI CÙNG (Delicate Petal)
    const singlePetalCanvas = document.createElement('canvas');
    singlePetalCanvas.width = singlePetalCanvas.height = 140;
    const pCtx = singlePetalCanvas.getContext('2d');

    (function drawSinglePetal() {
      pCtx.save();
      pCtx.translate(70, 70);
      pCtx.beginPath();
      pCtx.moveTo(0, -45);
      pCtx.bezierCurveTo(-38, -35, -42, 25, 0, 45);
      pCtx.bezierCurveTo(42, 25, 38, -35, 0, -45);
      const g = pCtx.createRadialGradient(0, 0, 3, 0, 0, 45);
      g.addColorStop(0, '#2687d6');
      g.addColorStop(0.6, '#6ec7fd');
      g.addColorStop(0.95, '#d6f4ff');
      g.addColorStop(1, '#ffffff');
      pCtx.fillStyle = g;
      pCtx.shadowColor = 'rgba(5, 35, 65, 0.2)';
      pCtx.shadowBlur = 6;
      pCtx.fill();
      pCtx.strokeStyle = 'rgba(230, 250, 255, 0.8)';
      pCtx.lineWidth = 0.8;
      pCtx.stroke();
      pCtx.restore();
    })();

    /* ==========================================================================
       ✦ 6. QUẢN LÝ CHUYỂN ĐỘNG CHAO LIỆNG MỀM MẠI CỦA HOA TRÊN MẶT NƯỚC ✦
       ========================================================================== */
    const flowers = [];
    const NUM_FLOWERS = 22;

    class PureBotanicalFlower {
      constructor(initRandomY = false) {
        this.reset(initRandomY);
      }
      reset(initRandomY = false) {
        this.x = Math.random() * w;
        this.y = initRandomY ? Math.random() * h : -65;
        this.size = 24 + Math.random() * 26;

        // Tỉ lệ: 60% là nguyên đóa hoa nở bung, 40% là cánh hoa đơn rơi lả tả
        this.isSinglePetal = Math.random() > 0.6;

        // Tốc độ rơi bồng bềnh êm ái
        this.speedY = 0.6 + Math.random() * 0.7;
        this.driftSpeed = 0.45 + Math.random() * 0.55;

        // Góc xoay chao đảo trong gió
        this.angle = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.012;

        // Độ nghiêng chao liệng mềm (Fluttering)
        this.flutter = Math.random() * Math.PI * 2;
        this.flutterSpeed = 0.016 + Math.random() * 0.02;

        this.opacity = 0.82 + Math.random() * 0.18;
      }
      update() {
        this.y += this.speedY;
        this.flutter += this.flutterSpeed;
        this.x += Math.sin(this.flutter) * this.driftSpeed;
        this.angle += this.rotSpeed;

        // Khi chạm đáy mặt nước
        if (this.y > h + 50) {
          if (Math.random() > 0.45) makeRipple(this.x, h - 25);
          this.reset(false);
        }
      }
      draw(c) {
        c.save();
        c.translate(this.x, this.y);

        // Hiệu ứng nghiêng nhẹ nhàng mềm mại, không bao giờ bị bóp dẹt méo mó
        const tiltX = Math.cos(this.flutter) * 0.25 + 0.85;
        const tiltY = Math.sin(this.flutter * 0.75) * 0.2 + 0.88;

        // 1. Bóng nước mờ êm dưới hoa
        c.save();
        c.translate(8, 14);
        c.rotate(this.angle);
        c.scale(tiltX * 0.85, tiltY * 0.5);
        c.globalAlpha = 0.15 * this.opacity;
        c.beginPath();
        c.arc(0, 0, this.size * 0.75, 0, Math.PI * 2);
        c.fillStyle = '#011222';
        c.fill();
        c.restore();

        // 2. Vẽ hoa hoặc cánh hoa
        c.rotate(this.angle);
        c.scale(tiltX, tiltY);
        c.globalAlpha = this.opacity;

        const rad = this.size;

        if (isCustomRoseLoaded && customRoseImg) {
          // Nếu có dán link ảnh thật: Dùng thẳng ảnh thật đó!
          c.drawImage(customRoseImg, -rad, -rad, rad * 2, rad * 2);
        } else {
          // Dùng đóa hoa lụa mềm hoặc cánh hoa đơn rơi lả tả
          if (this.isSinglePetal) {
            c.drawImage(singlePetalCanvas, -rad * 0.8, -rad * 0.8, rad * 1.6, rad * 1.6);
          } else {
            c.drawImage(roseBloomCanvas, -rad, -rad, rad * 2, rad * 2);
          }
        }

        c.restore();
      }
    }

    for (let i = 0; i < NUM_FLOWERS; i++) {
      flowers.push(new PureBotanicalFlower(true));
    }

    function animateLoop() {
      ctx.clearRect(0, 0, w, h);

      // Vẽ sóng nước lan tỏa khi chạm
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rip = ripples[i];
        rip.r += rip.speed;
        rip.alpha -= 0.01;

        if (rip.alpha <= 0 || rip.r >= rip.maxR) {
          ripples.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(rip.x, rip.y, rip.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(130, 235, 255, ${rip.alpha * 0.85})`;
        ctx.lineWidth = 2.2;
        ctx.shadowColor = 'rgba(0, 240, 255, 0.65)';
        ctx.shadowBlur = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(rip.x, rip.y, Math.max(0, rip.r - 8), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(180, 80, 255, ${rip.alpha * 0.4})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();
      }

      // Vẽ và cập nhật hoa rơi bồng bềnh
      flowers.forEach(f => {
        f.update();
        f.draw(ctx);
      });

      requestAnimationFrame(animateLoop);
    }
    animateLoop();

    // Nút Xem báo ứng
    const btnEnter = document.getElementById('btnEnter');
    btnEnter.addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = btnEnter.getBoundingClientRect();
      makeRipple(rect.left + rect.width / 2, rect.top + rect.height / 2);
      alert("✦ ĐÃ KÍCH HOẠT: XEM BÁO ỨNG ✦\n(Giao diện mở đầu đã sẵn sàng cho bước tiếp theo của bạn!)");
    });
  </script>
</body>
