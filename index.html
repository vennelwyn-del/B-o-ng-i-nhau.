<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo Ứng Đời Nhau • Archive</title>

  <!-- Google Fonts: Vintage Script & Classic Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

  <!-- Thư viện Three.js tạo khối Blue Crystal 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-abyss: #061523;
      --crystal-cyan: #9de6f5;
      --crystal-blue: #3b88b5;
      --antique-cream: #f6f1e7;
      --soft-glow: rgba(157, 230, 245, 0.45);
      --glass-border: rgba(210, 245, 255, 0.35);
      --font-quote: 'Cormorant Garamond', Georgia, serif;
      --font-title: 'Alex Brush', cursive;
      --font-display: 'Cinzel', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-abyss);
      font-family: var(--font-quote);
      color: var(--antique-cream);
    }

    /* 1. LỚP NỀN ẢNH NƯỚC (bg.jpg) VỚI HIỆU ỨNG SÓNG NƯỚC 3D */
    .water-bg-layer {
      position: fixed;
      inset: -20px;
      background: radial-gradient(circle at 50% 50%, rgba(4, 20, 34, 0.25) 0%, rgba(2, 10, 18, 0.75) 100%),
                  url('bg.jpg') center center / cover no-repeat;
      filter: saturate(1.15) contrast(1.05);
      z-index: 1;
      animation: waterUndulate 9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes waterUndulate {
      0% { transform: scale(1.02) rotate(0deg); }
      50% { transform: scale(1.045) translateY(-5px) rotate(0.4deg); }
      100% { transform: scale(1.03) translateY(4px) rotate(-0.3deg); }
    }

    /* 2. CANVAS HIỆU ỨNG: GỢN SÓNG 3D KHI CHẠM & HOA HỒNG XANH RƠI */
    #fxCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: auto;
    }

    /* 3. LỚP PHỦ MÀU VINTAGE & HẠT SÁNG */
    .vintage-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      background: radial-gradient(circle at center, transparent 40%, rgba(2, 7, 12, 0.72) 100%);
    }

    /* 4. GIAO DIỆN CHÍNH (THEO PHONG CÁCH ẢNH 1) */
    .landing-screen {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 24px 34px;
      pointer-events: none; /* Các nút con sẽ bật pointer-events */
    }

    /* Góc trên: Tiêu đề nhỏ & Nút âm thanh */
    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .edition-tag {
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(220, 245, 255, 0.85);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 0 10px rgba(157, 230, 245, 0.5);
    }

    .top-actions {
      display: flex;
      gap: 12px;
    }

    .circle-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(10, 32, 48, 0.55);
      border: 1px solid var(--glass-border);
      color: var(--antique-cream);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
    }

    .circle-icon-btn:hover {
      background: rgba(24, 70, 95, 0.8);
      border-color: var(--crystal-cyan);
      box-shadow: 0 0 16px var(--soft-glow);
      transform: translateY(-2px);
    }

    .circle-icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* KHU VỰC TRUNG TÂM: KHỐI BLUE CRYSTAL 3D & NỘI DUNG */
    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
      pointer-events: auto;
      max-width: 650px;
    }

    /* Container chứa khối pha lê 3D */
    .crystal-container {
      width: 260px;
      height: 280px;
      position: relative;
      cursor: grab;
      filter: drop-shadow(0 0 35px rgba(157, 230, 245, 0.45));
      transition: transform 0.4s ease;
    }

    .crystal-container:active {
      cursor: grabbing;
    }

    #threeCanvas {
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Dòng chữ mô tả quote theo yêu cầu */
    .quote-text {
      font-family: var(--font-quote);
      font-style: italic;
      font-size: clamp(1.45rem, 3.2vw, 2.1rem);
      font-weight: 400;
      color: #ffffff;
      line-height: 1.35;
      letter-spacing: 0.5px;
      margin-top: 14px;
      text-shadow: 0 2px 15px rgba(157, 230, 245, 0.6), 0 1px 3px rgba(0,0,0,0.8);
    }

    .sub-brand {
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(184, 235, 245, 0.85);
      margin-top: 10px;
      margin-bottom: 24px;
      text-shadow: 0 0 8px rgba(157, 230, 245, 0.4);
    }

    /* NÚT CHỮ NHẬT "XEM BÁO ỨNG" (THEO CHUẨN ẢNH 1) */
    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 13px 36px;
      background: linear-gradient(135deg, rgba(216, 245, 255, 0.22) 0%, rgba(20, 60, 85, 0.65) 100%);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      color: #ffffff;
      font-family: var(--font-quote);
      font-size: 1.22rem;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 
        inset 0 0 20px rgba(216, 245, 255, 0.2),
        0 10px 30px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(157, 230, 245, 0.25);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      text-decoration: none;
    }

    .btn-action-primary:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #ffffff;
      background: linear-gradient(135deg, rgba(216, 245, 255, 0.35) 0%, rgba(28, 85, 120, 0.85) 100%);
      box-shadow: 
        inset 0 0 25px rgba(255, 255, 255, 0.4),
        0 15px 40px rgba(2, 12, 20, 0.6),
        0 0 35px rgba(157, 230, 245, 0.6);
    }

    .btn-action-primary .crystal-icon {
      font-size: 1rem;
      color: var(--crystal-cyan);
    }

    .btn-action-primary .arrow-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      transition: transform 0.3s ease;
    }

    .btn-action-primary:hover .arrow-icon {
      transform: translateX(4px);
    }

    .hint-tap {
      font-family: var(--font-display);
      font-size: 0.66rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(220, 245, 255, 0.6);
      margin-top: 10px;
    }

    /* KHU VỰC CUỐI: CÁC NÚT MẠNG XÃ HỘI (THEO CHUẨN ẢNH 1) */
    .bottom-bar {
      display: flex;
      gap: 36px;
      align-items: center;
      pointer-events: auto;
    }

    .social-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      color: rgba(220, 245, 255, 0.7);
      transition: all 0.3s ease;
    }

    .social-item:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .social-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(10, 32, 48, 0.55);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    .social-item:hover .social-circle {
      border-color: var(--crystal-cyan);
      background: rgba(24, 70, 95, 0.85);
      box-shadow: 0 0 18px var(--soft-glow);
    }

    .social-circle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .social-label {
      font-family: var(--font-display);
      font-size: 0.68rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Responsive cho điện thoại */
    @media (max-width: 600px) {
      .crystal-container {
        width: 200px;
        height: 220px;
      }
      .quote-text {
        font-size: 1.35rem;
      }
      .btn-action-primary {
        padding: 12px 28px;
        font-size: 1.1rem;
      }
      .bottom-bar {
        gap: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Lớp hình nền sóng nước cá bơi -->
  <div class="water-bg-layer"></div>

  <!-- 2. Canvas sóng nước tương tác & Hoa hồng xanh rơi -->
  <canvas id="fxCanvas"></canvas>

  <!-- 3. Lớp phủ viền mờ nghệ thuật -->
  <div class="vintage-vignette"></div>

  <!-- 4. Giao diện mở đầu chính -->
  <main class="landing-screen">

    <!-- Thanh trên cùng -->
    <header class="top-bar">
      <div class="edition-tag">✦ BÁO ỨNG ĐỜI NHAU • ARCHIVE 2026</div>
      <div class="top-actions">
        <!-- Nút bật/tắt tiếng biển -->
        <button class="circle-icon-btn" id="audioToggleBtn" title="Bật/Tắt âm thanh biển">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
      </div>
    </header>

    <!-- Trung tâm: Khối Blue Crystal 3D + Chữ + Nút Xem báo ứng -->
    <div class="center-content">
      
      <!-- Khối Blue Crystal 3D lơ lửng -->
      <div class="crystal-container" id="crystalContainer" title="Kéo để xoay khối Blue Crystal 3D">

      </div>

      <!-- Câu trích dẫn chữ mềm -->

      <!-- Nút chữ nhật "Xem báo ứng" -->
      <button class="btn-action-primary" id="btnEnter">

    <!-- Thanh dưới cùng: Discord & Facebook -->
    <footer class="bottom-bar">

      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="social-item">

          <svg viewBox="0 0 24 24"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/></svg>

  </main>

  <script>
    /* ==========================================================================
       1. THREE.JS: KHỐI BLUE CRYSTAL 3D LƠ LỬNG
       ========================================================================== */
    const container = document.getElementById('crystalContainer');
    const threeCanvas = document.getElementById('threeCanvas');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 4.2;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Ánh sáng tạo độ trong suốt và lấp lánh cho pha lê
    const ambientLight = new THREE.AmbientLight(0x8fe3f5, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight1.position.set(5, 5, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x1a7a9e, 1.8);
    dirLight2.position.set(-5, -5, 2);
    scene.add(dirLight2);

    // Tạo hình dạng khối Blue Crystal đa diện lấp lánh
    const crystalGeo = new THREE.OctahedronGeometry(1.3, 0);
    // Kéo giãn nhẹ để tạo dáng viên ngọc pha lê cao vút thanh thoát
    crystalGeo.scale(0.85, 1.45, 0.85);

    const crystalMat = new THREE.MeshPhysicalMaterial({
      color: 0x62c9e8,
      emissive: 0x093a52,
      roughness: 0.1,
      metalness: 0.15,
      transmission: 0.75, // Độ xuyên sáng như thủy tinh
      ior: 1.52,          // Độ chiết suất pha lê
      transparent: true,
      opacity: 0.92,
      flatShading: true   // Đổ bóng sắc cạnh góc đa diện 3D
    });

    const crystalMesh = new THREE.Mesh(crystalGeo, crystalMat);
    scene.add(crystalMesh);

    // Thêm các cạnh phát sáng viền pha lê
    const wireGeo = new THREE.WireframeGeometry(crystalGeo);
    const wireMat = new THREE.LineBasicMaterial({ color: 0xd7f7ff, linewidth: 1.5, transparent: true, opacity: 0.65 });
    const wireframe = new THREE.LineSegments(wireGeo, wireMat);
    crystalMesh.add(wireframe);

    // Hiệu ứng tương tác xoay khối pha lê theo chuột
    let mouseX = 0, mouseY = 0;
    let targetRotX = 0, targetRotY = 0;
    let isDragging = false;
    let prevMousePos = { x: 0, y: 0 };

    window.addEventListener('mousemove', (e) => {
      const normX = (e.clientX / window.innerWidth) * 2 - 1;
      const normY = -(e.clientY / window.innerHeight) * 2 + 1;
      targetRotY = normX * 0.45;
      targetRotX = -normY * 0.35;
    });

    container.addEventListener('mousedown', (e) => {
      isDragging = true;
      prevMousePos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => isDragging = false);

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - prevMousePos.x;
      const deltaY = e.clientY - prevMousePos.y;
      crystalMesh.rotation.y += deltaX * 0.015;
      crystalMesh.rotation.x += deltaY * 0.015;
      prevMousePos = { x: e.clientX, y: e.clientY };
    });

    // Touch trên điện thoại
    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    });

    window.addEventListener('touchend', () => isDragging = false);

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const deltaX = e.touches[0].clientX - prevMousePos.x;
      const deltaY = e.touches[0].clientY - prevMousePos.y;
      crystalMesh.rotation.y += deltaX * 0.015;
      crystalMesh.rotation.x += deltaY * 0.015;
      prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    // Render loop cho khối Blue Crystal
    let clock = new THREE.Clock();
    function animateThree() {
      requestAnimationFrame(animateThree);
      const elapsedTime = clock.getElapsedTime();

      // Pha lê tự xoay nhẹ & nhấp nhô lơ lửng bồng bềnh
      if (!isDragging) {
        crystalMesh.rotation.y += 0.007;
        crystalMesh.rotation.y += (targetRotY - crystalMesh.rotation.y) * 0.05;
        crystalMesh.rotation.x += (targetRotX - crystalMesh.rotation.x) * 0.05;
      }
      crystalMesh.position.y = Math.sin(elapsedTime * 1.6) * 0.12;

      renderer.render(scene, camera);
    }
    animateThree();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    /* ==========================================================================
       2. CANVAS HIỆU ỨNG: GỢN SÓNG 3D KHI CHẠM & HOA HỒNG XANH RƠI
       ========================================================================== */
    const fxCanvas = document.getElementById('fxCanvas');
    const ctx = fxCanvas.getContext('2d');

    let width = (fxCanvas.width = window.innerWidth);
    let height = (fxCanvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = fxCanvas.width = window.innerWidth;
      height = fxCanvas.height = window.innerHeight;
    });

    // Danh sách các vòng sóng nước lan tỏa khi chạm
    const ripples = [];
    function spawnWaterRipple(x, y) {
      ripples.push({
        x, y,
        radius: 3,
        maxRadius: Math.min(width, height) * 0.38 + 50,
        alpha: 0.9,
        speed: 2.6,
        lineWidth: 2.4
      });
      // Sóng đôi phụ lan theo sau
      setTimeout(() => {
        ripples.push({
          x, y,
          radius: 2,
          maxRadius: Math.min(width, height) * 0.28,
          alpha: 0.65,
          speed: 2.1,
          lineWidth: 1.6
        });
      }, 160);
    }

    // Nhấp chuột hoặc chạm tay vào bất cứ đâu đều tạo sóng nước
    window.addEventListener('pointerdown', (e) => {
      spawnWaterRipple(e.clientX, e.clientY);
    });

    // DANH SÁCH HOA HỒNG XANH RƠI (THEO ẢNH 3)
    const roses = [];
    const NUM_ROSES = 24;

    class BlueRoseParticle {
      constructor(initRandomY = false) {
        this.reset(initRandomY);
      }
      reset(initRandomY = false) {
        this.x = Math.random() * width;
        this.y = initRandomY ? Math.random() * height : -40;
        this.size = 14 + Math.random() * 20; // Kích thước đóa hoa
        this.speedY = 0.6 + Math.random() * 1.1;
        this.speedX = (Math.random() - 0.5) * 0.7;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.swayAngle = Math.random() * Math.PI * 2;
        this.swaySpeed = 0.015 + Math.random() * 0.025;
        this.opacity = 0.65 + Math.random() * 0.35;
      }
      update() {
        this.swayAngle += this.swaySpeed;
        this.y += this.speedY;
        this.x += Math.sin(this.swayAngle) * 0.9 + this.speedX;
        this.rotation += this.rotSpeed;

        // Khi hoa rơi chạm đáy màn hình nước thì tạo sóng nhẹ và lặp lại
        if (this.y > height + 40) {
          if (Math.random() > 0.4) spawnWaterRipple(this.x, height - 30);
          this.reset(false);
        }
      }
      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.rotation);
        c.globalAlpha = this.opacity;

        // Vẽ đóa hoa hồng xanh biếc nhiều lớp cánh (Màu chuẩn theo Ảnh 3)
        const s = this.size;

        // Cánh ngoài cùng - xanh biển thẫm
        c.fillStyle = '#1c557d';
        c.beginPath();
        c.arc(0, 0, s, 0, Math.PI * 2);
        c.fill();

        // Cánh giữa - xanh lam tươi
        const midGrad = c.createRadialGradient(0, 0, 2, 0, 0, s * 0.8);
        midGrad.addColorStop(0, '#75c8ee');
        midGrad.addColorStop(0.7, '#2b78a9');
        midGrad.addColorStop(1, '#16486e');
        c.fillStyle = midGrad;
        c.beginPath();
        c.arc(0, 0, s * 0.78, 0, Math.PI * 2);
        c.fill();

        // Tâm hoa cuộn cánh xoáy ốc lấp lánh tuyết
        c.strokeStyle = 'rgba(215, 246, 255, 0.7)';
        c.lineWidth = 1.3;
        for (let r = s * 0.65; r > 3; r -= s * 0.22) {
          c.beginPath();
          c.arc(0, 0, r, 0.2, Math.PI * 1.7);
          c.stroke();
          c.rotate(0.75);
        }

        c.restore();
      }
    }

    for (let i = 0; i < NUM_ROSES; i++) {
      roses.push(new BlueRoseParticle(true));
    }

    // Vòng lặp vẽ Canvas hiệu ứng
    function renderFxCanvas() {
      ctx.clearRect(0, 0, width, height);

      // Vẽ các vòng sóng nước lan tỏa khi chạm
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rip = ripples[i];
        rip.radius += rip.speed;
        rip.alpha -= 0.009;

        if (rip.alpha <= 0 || rip.radius >= rip.maxRadius) {
          ripples.splice(i, 1);
          continue;
        }

        ctx.save();
        // Vòng sóng chính phát sáng cyan
        ctx.beginPath();
        ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(184, 240, 255, ${rip.alpha * 0.85})`;
        ctx.lineWidth = rip.lineWidth;
        ctx.shadowColor = 'rgba(157, 230, 245, 0.7)';
        ctx.shadowBlur = 12;
        ctx.stroke();

        // Vòng khúc xạ nước bên trong
        ctx.beginPath();
        ctx.arc(rip.x, rip.y, Math.max(0, rip.radius - 8), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(100, 200, 235, ${rip.alpha * 0.45})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();
      }

      // Vẽ và cập nhật hoa hồng rơi
      roses.forEach(rose => {
        rose.update();
        rose.draw(ctx);
      });

      requestAnimationFrame(renderFxCanvas);
    }
    renderFxCanvas();

    /* ==========================================================================
       3. NÚT "XEM BÁO ỨNG" & ÂM THANH SÓNG BIỂN
       ========================================================================== */
    const btnEnter = document.getElementById('btnEnter');
    btnEnter.addEventListener('click', (e) => {
      e.stopPropagation();
      // Hiệu ứng sóng nước bùng nổ từ tâm nút bấm
      const rect = btnEnter.getBoundingClientRect();
      spawnWaterRipple(rect.left + rect.width / 2, rect.top + rect.height / 2);

      // Tạm thời thông báo sẵn sàng cho bước chuyển trang tiếp theo
      alert("Đã kích hoạt bước vào: 'Xem Báo Ứng'!\n(Giao diện mở đầu đã hoàn thành xuất sắc, sẵn sàng cho bước tiếp theo của bạn)");
    });

    // Âm thanh sóng biển Web Audio tự động
    let audioCtx = null, oceanGain = null, isPlaying = false;
    function toggleOceanSound() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        oceanGain = audioCtx.createGain();
        oceanGain.gain.setValueAtTime(0, audioCtx.currentTime);
        oceanGain.connect(audioCtx.destination);

        // Tạo tiếng sóng vỗ
        const bufferSize = audioCtx.sampleRate * 3;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.08;

        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        noise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(260, audioCtx.currentTime);

        const lfo = audioCtx.createOscillator();
        lfo.frequency.setValueAtTime(0.12, audioCtx.currentTime);
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.setValueAtTime(300, audioCtx.currentTime);
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);

        noise.connect(filter);
        filter.connect(oceanGain);
        noise.start();
        lfo.start();
      }

      if (audioCtx.state === 'suspended') audioCtx.resume();

      isPlaying = !isPlaying;
      if (isPlaying) {
        oceanGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 2);
        document.getElementById('audioToggleBtn').style.borderColor = 'var(--crystal-cyan)';
      } else {
        oceanGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
        document.getElementById('audioToggleBtn').style.borderColor = 'var(--glass-border)';
      }
    }

    document.getElementById('audioToggleBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleOceanSound();
    });
  </script>
